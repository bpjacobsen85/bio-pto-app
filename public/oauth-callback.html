<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ArcGIS OAuth callback</title>
  </head>
  <body>
    <p>Completing ArcGIS sign in...</p>
    <script src="https://js.arcgis.com/4.34/"></script>
    <script>
      require(["esri/identity/IdentityManager"], function (esriId) {
        esriId.completeOAuth2();
      });
    </script>
  </body>
</html>
