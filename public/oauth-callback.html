<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ArcGIS OAuth callback</title>
  </head>
  <body>
    <p>Completing ArcGIS sign in...</p>
    <script>
      (function () {
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        if (window.opener && !window.opener.closed) {
          if (hash) {
            window.opener.dispatchEvent(
              new CustomEvent("arcgis:auth:hash", { detail: hash })
            );
          }

          if (search) {
            window.opener.dispatchEvent(
              new CustomEvent("arcgis:auth:location:search", { detail: search })
            );
          }

          window.close();
          return;
        }

        window.location.replace("/" + search + hash);
      })();
    </script>
  </body>
</html>
